<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Thumbnail Generator</title>

  <style>
    body {
      background:#111;
      color:white;
      text-align:center;
      font-family:sans-serif;
    }

    .box {
      margin-top: 50px;
    }

    input, button {
      padding:10px;
      margin:10px;
      border-radius:8px;
      border:none;
    }

    button {
      background:#00c896;
      color:white;
      cursor:pointer;
    }

    button:hover {
      background:#00a87a;
    }

    img {
      margin-top:20px;
      border-radius:10px;
      max-width:80%;
    }
  </style>
</head>

<body>

<div class="box">

<h1>🎬 Générateur de Thumbnail PRO</h1>

<input type="file" id="videoInput"><br>

⏱ Temps (en secondes) :
<input type="number" id="timeInput" value="1"><br>

<button id="btn">Générer Thumbnail</button>

<div id="result"></div>

</div>

<script>

document.getElementById("btn").addEventListener("click", async function () {

  const fileInput = document.getElementById("videoInput");
  const resultDiv = document.getElementById("result");
  const time = document.getElementById("timeInput").value;

  if (fileInput.files.length === 0) {
    alert("Choisis une vidéo !");
    return;
  }

  const formData = new FormData();
  formData.append("video", fileInput.files[0]);
  formData.append("time", time);

  // 🔥 loader
  resultDiv.innerHTML = "⏳ Génération en cours...";

  try {
    const response = await fetch("/thumbnail-upload", {
      method: "POST",
      body: formData
    });

    const data = await response.json();

   resultDiv.innerHTML =
  "<p>Thumbnail généré :</p>" +
  "<img src='" + data.thumbnail + "'>" +
  "<br><br>" +
  "<a href='" + data.thumbnail + "' download>" +
  "<button>📥 Télécharger</button></a>";

  } catch (error) {
    console.error(error);
    resultDiv.innerHTML = "Erreur 😢";
  }

});

</script>

</body>
</html>
