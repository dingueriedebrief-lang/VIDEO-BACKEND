<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Video App</title>
</head>

<body>

  <!-- 🔴 PARTIE YOUTUBE -->
  <h2>Importer une vidéo YouTube 🎥</h2>

  <input type="text" id="youtubeUrl" placeholder="Colle le lien YouTube ici">
<button onclick="analyzeYoutube()">Analyser</button>

  <p id="ytStatus"></p>

  <hr>

  <!-- 🟢 PARTIE UPLOAD CLASSIQUE -->
  <h2>Uploader une vidéo 🎥</h2>

  <input type="file" id="videoInput" />
  <br><br>
  <button onclick="uploadVideo()">Envoyer</button>

  <p id="status"></p>

  <hr>

  <!-- 🎬 LISTE DES VIDÉOS -->
  <h3>Vidéos uploadées 🎬</h3>
  <div id="videoList"></div>

  <script>
const API_URL = "https://video-backend-production-07ad.up.railway.app";

// =====================
// 🎬 UPLOAD VIDÉO
// =====================
async function uploadVideo() {
  console.log("CLICK OK");

  const fileInput = document.getElementById("videoInput");
  const status = document.getElementById("status");

  if (!fileInput.files.length) {
    status.innerText = "❌ Choisis une vidéo";
    return;
  }

  const file = fileInput.files[0];
  const formData = new FormData();
  formData.append("video", file);

  status.innerText = "⏳ Envoi en cours...";

  try {
    const res = await fetch(`${API_URL}/upload`, {
      method: "POST",
      body: formData
    });

    const text = await res.text();

    console.log("STATUS:", res.status);
    console.log("REPONSE:", text);

    status.innerText = "✅ Succès : Upload réussi 🎉";

  } catch (err) {
    console.error(err);
    status.innerText = "❌ Erreur : " + err.message;
  }
}

// =====================
// 🎥 ANALYSE YOUTUBE
// =====================
async function analyzeYoutube() {
  const input = document.getElementById("youtubeUrl");
  const url = input.value;

  if (!url) {
    alert("❌ Colle un lien YouTube");
    return;
  }

  console.log("Analyse du lien :", url);

  try {
    const res = await fetch(`${API_URL}/analyze`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url })
    });

    const data = await res.json();

    console.log("Réponse backend :", data);

    alert("✅ Vidéo analysée ! (regarde la console)");

  } catch (err) {
    console.error(err);
    alert("❌ Erreur analyse");
  }
}
</script>
