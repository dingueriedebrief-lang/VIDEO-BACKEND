<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Video App</title>
</head>
<body>

  <h2>Importer une vidéo YouTube 🎥</h2>

  <input type="text" id="youtubeLink" placeholder="Colle le lien YouTube ici" />
  <button onclick="analyzeVideo()">Analyser</button>

  <hr>

  <h2>Uploader une vidéo 🎥</h2>

  <input type="file" id="videoInput" />
  <br><br>
  <button onclick="uploadVideo()">Envoyer</button>

  <p id="status"></p>

  <script>
    // 🎯 ANALYSE YOUTUBE
    async function analyzeVideo() {
      const input = document.getElementById("youtubeLink").value;

      console.log("Analyse du lien :", input);

      try {
        const res = await fetch("https://video-backend-production-07ad.up.railway.app/analyze", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ url: input })
        });

        const data = await res.json();

        console.log("Réponse :", data);

        alert(data.message);

      } catch (err) {
        console.error(err);
        alert("Erreur analyse");
      }
    }

    // 🎥 UPLOAD VIDEO
    async function uploadVideo() {
      const fileInput = document.getElementById("videoInput");
      const status = document.getElementById("status");

      const file = fileInput.files[0];

      if (!file) {
        status.innerText = "❌ Choisis un fichier";
        return;
      }

      const formData = new FormData();
      formData.append("video", file);

      try {
        const res = await fetch("https://video-backend-production-07ad.up.railway.app/upload", {
          method: "POST",
          body: formData
        });

        const text = await res.text();

        status.innerText = "✅ " + text;

      } catch (err) {
        console.error(err);
        status.innerText = "❌ Erreur upload";
      }
    }
  </script>

</body>
</html>
