<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Upload Vidéo</title>
</head>
<body>

    <h2>Uploader une vidéo 🎥</h2>

    <input type="file" id="videoInput" />
    <br><br>
    <button onclick="uploadVideo()">Envoyer</button>

    <p id="status"></p>

    <script>
async function uploadVideo() {
    console.log("CLICK OK");

    const fileInput = document.getElementById("videoInput");
    const status = document.getElementById("status");

    if (!fileInput.files.length) {
        status.innerText = "❌ Choisis une vidéo";
        return;
    }

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append("video", file);

    status.innerText = "⏳ Envoi en cours...";

    try {
        const response = await fetch("https://video-backend-production-07ad.up.railway.app/upload", {
            method: "POST",
            body: formData
        });

        console.log("STATUS:", response.status);

        const data = await response.text();
        console.log("REPONSE:", data);

        status.innerText = "✅ Succès : " + data;

    } catch (error) {
        console.error("ERREUR:", error);
        status.innerText = "❌ Erreur : " + error.message;
    }
}
</script>
